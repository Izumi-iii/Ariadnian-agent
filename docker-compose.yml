# Ariadne 网页版部署
#
#   cp deploy/ariadne.env.example deploy/ariadne.env   # 填访问密码和模型 Key
#   docker compose up -d --build                         # 从源码构建并启动，打开 http://服务器IP:8000
#
# 有域名、想要 HTTPS（公网部署推荐）：在 deploy/ariadne.env 里填 DOMAIN，然后
#   ARIA_BIND=127.0.0.1 docker compose --profile https up -d --build
#
# 不想在服务器上构建，可以直接用 CI 发布的镜像：
#   docker compose pull && docker compose up -d
#
# 可选：更好的 PDF 解析（在 deploy/ariadne.env 里设置 PDF_PARSER，见注释）
#   docker compose --profile grobid up -d     # GROBID：英文论文的章节、段落、公式，CPU 即可，约 4GB 内存
#   docker compose --profile mineru up -d     # MinerU：中文、扫描件 OCR、复杂版式，需要 NVIDIA GPU，镜像需先按 MinerU 文档构建
name: ariadne

services:
  ariadne:
    image: ${ARIADNE_IMAGE:-ghcr.io/tkzzzzzz6/ariadnian-agent:latest}
    build:
      context: .
      # 国内网络连不上 Docker Hub 时，在仓库根目录的 .env 里设置这些变量（见 README「国内网络」）
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-slim}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        PYPI_INDEX: ${PYPI_INDEX:-https://pypi.org/simple}
    restart: unless-stopped
    env_file: deploy/ariadne.env
    ports:
      # 启用 https 时把 ARIA_BIND 设成 127.0.0.1，只让 Caddy 访问
      - "${ARIA_BIND:-0.0.0.0}:${ARIA_PORT:-8000}:8000"
    volumes:
      - ariadne-data:/data
    # 限制资源，防止一个人把服务器拖垮
    mem_limit: 2g
    cpus: 2

  # ---- 可选：PDF 解析服务 ----
  grobid:
    # 只含 CRF 模型的轻量镜像（约 500MB），适合全文解析；国内可用 GROBID_IMAGE 换成镜像站地址
    image: ${GROBID_IMAGE:-grobid/grobid:0.9.1-crf}
    profiles: [grobid]
    restart: unless-stopped
    init: true
    ulimits:
      core: 0
    mem_limit: 4g

  mineru:
    # MinerU 官方没有发布现成镜像：先按 https://github.com/opendatalab/MinerU 的 docker/ 目录构建（docker build -t mineru:latest ...）
    image: ${MINERU_IMAGE:-mineru:latest}
    profiles: [mineru]
    restart: unless-stopped
    command: mineru-api --host 0.0.0.0 --port 8000
    shm_size: 8g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    profiles: [https]
    restart: unless-stopped
    env_file: deploy/ariadne.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - ariadne

volumes:
  ariadne-data:
  caddy-data:
  caddy-config:
