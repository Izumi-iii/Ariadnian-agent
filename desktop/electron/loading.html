<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src file: data:" />
    <title>Ariadne</title>
    <style>
      body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #616161; background: #fff; user-select: none }
      img { width: 88px; height: 88px; margin-bottom: 14px }
      h1 { font-size: 22px; color: #242424; font-weight: 600; margin: 0 0 6px }
      .dots span { width: 9px; height: 9px; border-radius: 50%; background: #0078d4; display: inline-block; margin: 18px 4px 0; animation: b 1s infinite }
      .dots span:nth-child(2) { animation-delay: .15s } .dots span:nth-child(3) { animation-delay: .3s }
      @keyframes b { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
    </style>
  </head>
  <body>
    <img src="build/icon.png" alt="" />
    <h1>Ariadne</h1>
    <div>研究报告助手正在启动…</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </body>
</html>
