# 自动生成 Release 说明的分类规则（对应 workflows/release.yml 里的 generate_release_notes: true）
# GitHub 的自动生成器以「合入的 PR」为数据源，按 PR label 归类，
# 不会解析 commit message 前缀（feat: / fix: ...），所以要靠这里的 label 配置才能分出章节。
# 用法：给 PR 打上对应 label；没有 label 的 PR 会落到最后的「其他变更」。
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot          # 只检查 Actions 版本升级，不必写进用户可见的更新说明
  categories:
    - title: 💥 破坏性变更
      labels:
        - breaking-change
        - semver-major
    - title: ✨ 新功能
      labels:
        - enhancement
        - feature
        - semver-minor
    - title: 🐛 缺陷修复
      labels:
        - bug
        - fix
    - title: 📖 文档
      labels:
        - documentation
    - title: 📦 依赖更新
      labels:
        - dependencies
    - title: ⚙️ 构建与 CI
      labels:
        - ci
        - build
        - chore
    - title: 🔧 其他变更
      labels:
        - "*"                 # 兜底：任何没被上面匹配到的 PR 都会落到这里
